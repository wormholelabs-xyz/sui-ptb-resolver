name: Release

on:
  push:
    branches: [main, release]
  workflow_dispatch:

# Least-privilege default; the publish job opts into the write scopes it needs.
permissions:
  contents: read

jobs:
  security-check:
    name: Security Validation
    runs-on: ubuntu-latest
    env:
      GH_EVENT_NAME: ${{ github.event_name }}
      GH_REF: ${{ github.ref }}
      GH_ACTOR: ${{ github.actor }}
      GH_SHA: ${{ github.sha }}
      GH_WORKFLOW: ${{ github.workflow }}
      GH_RUN_ID: ${{ github.run_id }}
    steps:
      - name: Validate workflow trigger
        run: |
          echo "🔒 Security Check: Validating workflow trigger"
          ALLOWED_EVENTS="push workflow_dispatch"
          if [[ ! "$ALLOWED_EVENTS" =~ "$GH_EVENT_NAME" ]]; then
            echo "❌ Unauthorized workflow trigger: $GH_EVENT_NAME"
            exit 1
          fi

      - name: Validate branch
        run: |
          # For push events, only allow main and release branches
          if [[ "$GH_EVENT_NAME" == "push" ]]; then
            if [[ "$GH_REF" != "refs/heads/main" ]] && [[ "$GH_REF" != "refs/heads/release" ]]; then
              echo "❌ Push events only allowed from main or release branches"
              exit 1
            fi
          fi

          # For workflow_dispatch, only allow release and hotfix/* branches
          if [[ "$GH_EVENT_NAME" == "workflow_dispatch" ]]; then
            if [[ "$GH_REF" != "refs/heads/release" ]] && [[ ! "$GH_REF" =~ ^refs/heads/hotfix/.+ ]]; then
              echo "❌ Manual dispatch only allowed from release or hotfix/* branches"
              exit 1
            fi
          fi

          echo "✅ Branch validation passed for: $GH_REF"

      - name: Create audit log
        run: |
          mkdir -p audit-logs

          # Determine release type
          RELEASE_TYPE="unknown"
          if [[ "$GH_REF" == "refs/heads/main" ]]; then
            RELEASE_TYPE="prerelease"
          elif [[ "$GH_REF" == "refs/heads/release" ]]; then
            RELEASE_TYPE="production"
          elif [[ "$GH_REF" =~ ^refs/heads/hotfix/.+ ]]; then
            RELEASE_TYPE="hotfix"
          fi

          cat > "audit-logs/release-$(date +%Y%m%d-%H%M%S).json" << EOF
          {
            "timestamp": "$(date -u +%Y-%m-%dT%H:%M:%SZ)",
            "actor": "${GH_ACTOR}",
            "event": "${GH_EVENT_NAME}",
            "branch": "${GH_REF}",
            "commit": "${GH_SHA}",
            "workflow": "${GH_WORKFLOW}",
            "run_id": "${GH_RUN_ID}",
            "release_type": "${RELEASE_TYPE}"
          }
          EOF

      - name: Upload audit log
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: security-audit-${{ github.run_id }}
          path: audit-logs/
          retention-days: 90

  publish:
    needs: security-check
    name: Publish Release
    runs-on: ubuntu-latest
    permissions:
      contents: write # semantic-release tags/commits the changelog
      issues: write # semantic-release comments on released issues
      pull-requests: write # semantic-release comments on released PRs
      id-token: write # npm provenance / OIDC publish
    # Only require environment approval for production release and hotfix branches
    environment: ${{ github.ref == 'refs/heads/release' || startsWith(github.ref, 'refs/heads/hotfix/') && 'production' || '' }}
    env:
      GH_REF: ${{ github.ref }}
      GH_ACTOR: ${{ github.actor }}
      GH_SHA: ${{ github.sha }}
    outputs:
      release_created: ${{ steps.release.outputs.new_release_published }}
      tag_name: ${{ steps.release.outputs.new_release_git_tag }}
      version: ${{ steps.release.outputs.new_release_version }}
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Setup Bun
        uses: oven-sh/setup-bun@735343b667d3e6f658f44d0eca948eb6282f2b76 # pinning the commit to v2
        with:
          bun-version: latest
          no-cache: true

      - name: Setup Node.js
        # No `cache:` input -> setup-node does not enable actions/cache, so the
        # cache-poisoning vector does not apply here. Node is only needed for
        # `npm audit signatures` and the npm publish/verify (deps install via Bun).
        # Suppressed in .github/zizmor.yml (rules.cache-poisoning).
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: "lts/*"

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Build package
        run: bun run build

      - name: Audit signatures
        run: npm audit signatures

      - name: Pre-publish Security Audit
        run: |
          # Determine release type for audit log
          if [[ "$GH_REF" == "refs/heads/main" ]]; then
            echo "📝 Pre-release Security Audit"
            echo "============================="
            RELEASE_TYPE="Pre-release (Development)"
          elif [[ "$GH_REF" == "refs/heads/release" ]]; then
            echo "📝 Production Release Security Audit"
            echo "===================================="
            RELEASE_TYPE="Production Release"
          elif [[ "$GH_REF" =~ ^refs/heads/hotfix/.+ ]]; then
            echo "🔥 Hotfix Release Security Audit"
            echo "================================"
            RELEASE_TYPE="Hotfix"
          fi

          echo "Release Type: ${RELEASE_TYPE}"
          echo "Released by: ${GH_ACTOR}"
          echo "Release Time: $(date -u)"
          echo "Commit SHA: ${GH_SHA}"
          echo "Branch: ${GH_REF}"
          echo ""
          echo "⚠️  Publishing to npm registry will begin after this audit"

      - name: Setup hotfix prerelease config
        if: startsWith(github.ref, 'refs/heads/hotfix/')
        run: |
          echo "📝 Setting up prerelease configuration for hotfix branch"
          cp .github/configs/releaserc.prerelease.json .releaserc.json
          echo "✅ Prerelease config applied for hotfix branch"

      - name: Create Release
        id: release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          NPM_CONFIG_PROVENANCE: true
        run: |
          # Determine release type for logging
          if [[ "$GH_REF" == "refs/heads/main" ]]; then
            echo "📦 Creating prerelease (development)"
          elif [[ "$GH_REF" == "refs/heads/release" ]]; then
            echo "🔒 Creating production release after approvals"
          elif [[ "$GH_REF" =~ ^refs/heads/hotfix/.+ ]]; then
            echo "🔥 Creating hotfix release after approvals"
          fi

          echo "📦 Running semantic-release"
          echo "🔐 Using NPM OIDC authentication (no token required)"

          # Run semantic-release and capture outputs
          # Use 'set +e' to prevent script exit on failure so we can capture output
          set +e
          bunx semantic-release > release-output.txt 2>&1
          EXIT_CODE=$?
          set -e

          echo "Semantic-release exit code: $EXIT_CODE"
          echo "Semantic-release output:"
          cat release-output.txt

          # Set outputs for downstream jobs
          if [ $EXIT_CODE -eq 0 ]; then
            echo "new_release_published=true" >> "$GITHUB_OUTPUT"
            echo "Setting new_release_published=true"

            # Get the latest tag created by semantic-release
            git fetch --tags
            LATEST_TAG=$(git describe --tags --abbrev=0)
            VERSION=$(echo $LATEST_TAG | sed 's/^v//')  # Remove 'v' prefix if present

            echo "new_release_version=$VERSION" >> "$GITHUB_OUTPUT"
            echo "new_release_git_tag=$LATEST_TAG" >> "$GITHUB_OUTPUT"
            echo "Found release tag: $LATEST_TAG (version: $VERSION)"
          else
            echo "new_release_published=false" >> "$GITHUB_OUTPUT"
            echo "Setting new_release_published=false"
          fi

          # Exit with semantic-release's exit code to fail the workflow if it failed
          exit $EXIT_CODE

  verify-publish:
    name: Verify Package Published
    needs: [publish]
    if: always() && needs.publish.outputs.release_created == 'true' && github.ref != 'refs/heads/main'
    runs-on: ubuntu-latest
    steps:
      - name: Verify NPM Package
        env:
          PKG_VERSION: ${{ needs.publish.outputs.version }}
          PKG_TAG: ${{ needs.publish.outputs.tag_name }}
        run: |
          echo "✅ Verifying package was published to npm registry..."
          echo "Package: @wormhole-labs/sui-ptb-resolver"
          echo "Version: ${PKG_VERSION}"
          echo "Tag: ${PKG_TAG}"
          echo ""

          sleep 30
          npm view "@wormhole-labs/sui-ptb-resolver@${PKG_VERSION}" version

          echo ""
          echo "✅ Package successfully verified on npm registry"
