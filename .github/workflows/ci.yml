name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

# Least-privilege default; jobs opt into the extra scopes they need.
permissions:
  contents: read

jobs:
  lint-commits:
    name: Lint Commits
    runs-on: ubuntu-latest
    if: github.event_name == 'pull_request'
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Validate commits
        uses: wagoid/commitlint-github-action@b948419dd99f3fd78a6548d48f94e3df7f6bf3ed # v6
        with:
          configFile: ./config/commitlint.config.mjs
          helpURL: https://www.conventionalcommits.org/
          token: ${{ secrets.GITHUB_TOKEN }}

  lint:
    name: Lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        with:
          persist-credentials: false

      - name: Setup Bun
        uses: oven-sh/setup-bun@735343b667d3e6f658f44d0eca948eb6282f2b76 # pinning the commit to v2
        with:
          bun-version: latest

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Run ESLint
        run: bun run lint

      - name: Typecheck (incl. tests)
        run: bun run typecheck

      - name: Check formatting
        run: bun run format:check

  test-sdk:
    name: SDK Tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        with:
          persist-credentials: false

      - name: Setup Bun
        uses: oven-sh/setup-bun@735343b667d3e6f658f44d0eca948eb6282f2b76 # pinning the commit to v2
        with:
          bun-version: latest

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Run SDK unit tests
        run: bun run test

  security:
    name: Security Check
    runs-on: ubuntu-latest
    permissions:
      contents: read
      security-events: write # required to upload SARIF results
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        with:
          persist-credentials: false

      - name: Run Trivy vulnerability scanner
        # v0.36.0: patched for GHSA-69fq-xp46-6x23 (supply-chain compromise in <0.35.0)
        # and SHA-pins its own transitive actions (setup-trivy v0.2.6, actions/cache v5).
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          scan-type: "fs"
          scan-ref: "."
          format: "sarif"
          output: "trivy-results.sarif"
          severity: "CRITICAL,HIGH"

      - name: Upload Trivy scan results
        uses: github/codeql-action/upload-sarif@dd903d2e4f5405488e5ef1422510ee31c8b32357 # v3
        if: always()
        with:
          sarif_file: "trivy-results.sarif"

  release-preview:
    name: Release Preview
    runs-on: ubuntu-latest
    if: github.event_name == 'pull_request'
    permissions:
      contents: read
      pull-requests: write # required to post the release-preview PR comment
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Setup Bun
        uses: oven-sh/setup-bun@735343b667d3e6f658f44d0eca948eb6282f2b76 # pinning the commit to v2
        with:
          bun-version: latest

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Install release tools
        run: |
          # Install the tools we need for version calculation and changelog generation
          bun add -D conventional-recommended-bump conventional-changelog-cli conventional-changelog-angular

      - name: Analyze commits
        id: analyze
        run: |
          # Check if commits will trigger a release
          # semantic-release only releases on: fix, feat, BREAKING CHANGE
          # It skips: refactor, chore, docs, style, test, ci, build, perf, revert
          COMMITS=$(git log origin/main..HEAD --pretty=format:"%s%n%b")

          HAS_RELEASABLE_CHANGES=false
          if echo "$COMMITS" | grep -qE "^(fix|feat)(\(.*\))?:|BREAKING CHANGE:"; then
            HAS_RELEASABLE_CHANGES=true
            echo "✅ Found releasable commits (fix, feat, or BREAKING CHANGE)"
          else
            echo "⚠️  No releasable commits found - only refactor, chore, docs, etc."
            echo "⚠️  semantic-release will skip this release"
          fi
          echo "has_releasable_changes=$HAS_RELEASABLE_CHANGES" >> $GITHUB_OUTPUT

          # Get the recommended bump based on commits since main
          # Using npx to ensure compatibility with npm registry operations
          BUMP=$(npx conventional-recommended-bump -p angular)
          echo "bump=$BUMP" >> $GITHUB_OUTPUT

          # Get all relevant tag information in one pass
          ALL_TAGS=$(git tag -l | sort -V)
          LATEST_STABLE_TAG=$(echo "$ALL_TAGS" | grep -E '^v?[0-9]+\.[0-9]+\.[0-9]+$' | tail -1)

          if [[ -n "$LATEST_STABLE_TAG" ]]; then
            # Extract version number from tag (remove 'v' prefix if present)
            CURRENT_VERSION=$(echo $LATEST_STABLE_TAG | sed 's/^v//')
            echo "Found latest stable tag: $LATEST_STABLE_TAG, using version: $CURRENT_VERSION"
          else
            # No stable tags found - semantic-release will start at 1.0.0
            CURRENT_VERSION="0.0.0"
            echo "No stable tags found, semantic-release will start at 1.0.0"
          fi
          echo "current_version=$CURRENT_VERSION" >> $GITHUB_OUTPUT

          # Calculate next version
          # Only calculate version if there are releasable changes
          if [[ "$HAS_RELEASABLE_CHANGES" == "true" ]]; then
            # semantic-release never uses 0.x.x versions, it always starts at 1.0.0
            # If current version starts with 0., treat it as pre-1.0.0 and bump to 1.0.0
            if [[ "$CURRENT_VERSION" =~ ^0\. ]]; then
              # Any 0.x.x version should become 1.0.0
              NEXT_VERSION="1.0.0"
              echo "Pre-1.0.0 version detected ($CURRENT_VERSION), next version will be 1.0.0"
            elif [[ "$BUMP" == "major" ]]; then
              NEXT_VERSION=$(echo $CURRENT_VERSION | awk -F. '{print $1+1".0.0"}')
            elif [[ "$BUMP" == "minor" ]]; then
              NEXT_VERSION=$(echo $CURRENT_VERSION | awk -F. '{print $1"."$2+1".0"}')
            elif [[ "$BUMP" == "patch" ]]; then
              NEXT_VERSION=$(echo $CURRENT_VERSION | awk -F. '{print $1"."$2"."$3+1}')
            else
              NEXT_VERSION=""
            fi
          else
            # No releasable changes, no version will be released
            NEXT_VERSION=""
          fi

          # Add prerelease suffix for development builds
          if [[ -n "$NEXT_VERSION" ]]; then
            # Find existing development tags for this version from our cached tag list
            EXISTING_DEV_TAGS=$(echo "$ALL_TAGS" | grep "^v\?${NEXT_VERSION}-development\." || true)
            
            if [[ -n "$EXISTING_DEV_TAGS" ]]; then
              # Get the highest development number
              HIGHEST_DEV=$(echo "$EXISTING_DEV_TAGS" | tail -1 | sed 's/.*development\.\([0-9]\+\).*/\1/' || echo "0")
              NEXT_DEV_NUM=$((HIGHEST_DEV + 1))
            else
              NEXT_DEV_NUM=1
            fi
            
            NEXT_VERSION="$NEXT_VERSION-development.$NEXT_DEV_NUM"
          fi

          echo "next_version=$NEXT_VERSION" >> $GITHUB_OUTPUT

      - name: Generate Release Notes
        id: release-notes
        run: |
          # Generate release notes for unreleased changes only (since last tag)
          LATEST_TAG=$(git describe --tags --abbrev=0 2>/dev/null || echo "")
          if [[ -n "$LATEST_TAG" ]]; then
            echo "Generating changelog since tag: $LATEST_TAG"
            # Generate changelog since the last tag
            # Using npx to ensure compatibility with npm registry operations
            npx conventional-changelog -p angular --commit-path . --tag-prefix "v" --pkg '{"version":"'$LATEST_TAG'"}' | tail -n +2 > CHANGELOG_PREVIEW.md || echo "No changes" > CHANGELOG_PREVIEW.md
          else
            echo "No tags found, generating full changelog"
            # Using npx to ensure compatibility with npm registry operations
            npx conventional-changelog -p angular -r 0 -u | tail -n +2 > CHANGELOG_PREVIEW.md || echo "No changes" > CHANGELOG_PREVIEW.md
          fi

          # If the file is empty or just has headers, generate from git log since last tag
          if [ ! -s CHANGELOG_PREVIEW.md ] || [ "$(wc -l < CHANGELOG_PREVIEW.md)" -lt 3 ]; then
            echo "### Recent Changes" > CHANGELOG_PREVIEW.md
            echo "" >> CHANGELOG_PREVIEW.md
            if [[ -n "$LATEST_TAG" ]]; then
              git log ${LATEST_TAG}..HEAD --pretty=format:"* %s (%h)" >> CHANGELOG_PREVIEW.md
            else
              git log origin/main..HEAD --pretty=format:"* %s (%h)" >> CHANGELOG_PREVIEW.md
            fi
          fi

      - name: Generate Release Preview
        id: release-preview
        env:
          NEXT_VERSION: ${{ steps.analyze.outputs.next_version }}
          BUMP: ${{ steps.analyze.outputs.bump }}
          HAS_RELEASABLE_CHANGES: ${{ steps.analyze.outputs.has_releasable_changes }}
        run: |
          echo "## 📦 Release Preview" > release-preview.md
          echo "" >> release-preview.md

          if [[ -n "$NEXT_VERSION" ]]; then
            echo "🚀 **Version that would be released:** \`$NEXT_VERSION\`" >> release-preview.md
            echo "" >> release-preview.md
            echo "📊 **Bump type:** $BUMP" >> release-preview.md
            echo "" >> release-preview.md
            echo "### 📝 Changes" >> release-preview.md
            echo "" >> release-preview.md
            cat CHANGELOG_PREVIEW.md >> release-preview.md
          else
            echo "🔍 **No pre-release will be created**" >> release-preview.md
            echo "" >> release-preview.md
            if [[ "$HAS_RELEASABLE_CHANGES" == "false" ]]; then
              echo "This PR only contains commits with types that don't trigger releases:" >> release-preview.md
              echo "- \`refactor:\`, \`chore:\`, \`docs:\`, \`style:\`, \`test:\`, \`ci:\`, \`build:\`, \`perf:\`, \`revert:\`" >> release-preview.md
              echo "" >> release-preview.md
              echo "To trigger a release, use commit types:" >> release-preview.md
              echo "- \`fix:\` for bug fixes (patch release)" >> release-preview.md
              echo "- \`feat:\` for new features (minor release)" >> release-preview.md
              echo "- \`BREAKING CHANGE:\` in commit body (major release)" >> release-preview.md
            else
              echo "No significant changes detected that would trigger a release." >> release-preview.md
            fi
          fi

          echo "" >> release-preview.md
          echo "---" >> release-preview.md
          echo "*This preview is automatically updated on each commit. The actual release will happen when this PR is merged to main.*" >> release-preview.md

          # Set output for comment
          {
            echo 'preview<<EOF'
            cat release-preview.md
            echo 'EOF'
          } >> $GITHUB_OUTPUT

      - name: Find existing comment
        uses: peter-evans/find-comment@3eae4d37986fb5a8592848f6a574fdf654e61f9e # v3
        id: find-comment
        with:
          issue-number: ${{ github.event.pull_request.number }}
          comment-author: "github-actions[bot]"
          body-includes: "📦 Release Preview"

      - name: Create or update comment
        # Intentional: find-and-edit a single PR comment by body text. Suppressed
        # in .github/zizmor.yml (rules.superfluous-actions). Pinned to a full SHA.
        uses: peter-evans/create-or-update-comment@71345be0265236311c031f5c7866368bd1eff043 # v4
        with:
          comment-id: ${{ steps.find-comment.outputs.comment-id }}
          issue-number: ${{ github.event.pull_request.number }}
          body: ${{ steps.release-preview.outputs.preview }}
          edit-mode: replace

  sui-test:
    name: Sui Test
    runs-on: ubuntu-latest
    container: mysten/sui-tools:mainnet-v1.57.3@sha256:2ec8e8abdf73ab158df4a82406f448d69ade64303d4b30669d2fdec263f9be5f
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        with:
          persist-credentials: false
      - name: Test Sui PTB Resolver
        working-directory: sui_ptb_resolver
        run: |
          sui move build
          sui move test
